blueprint:
  name: Thermostat rooms controller
  source_url: https://github.com/howels/esphome-thermostat/blob/main/blueprints/thermostat_rooms.yaml
  description: >-
    Single blueprint for the WT32S3-21S rotary thermostat. It sends the room
    list and outdoor weather to the thermostat, coordinates central heating,
    radiator valves and air conditioning when a room temperature is requested on
    the dial, and compensates for the gap between each unit's internal sensor
    and an external room temperature sensor.


    Create one automation: Settings > Automations & scenes > Create automation >
    Use a blueprint. Configure up to six rooms in the Room 1..6 sections below
    (leave unused room areas empty). Each room's area, icon, optional external
    temperature sensor, and heating/cooling max offsets are configured together.


    Room list. The automation sends the list to the thermostat every minute, at
    Home Assistant start, when the thermostat connects, when it opens the Rooms
    page, and two seconds after each request. Each area is grouped
    automatically. Climate entities with a cool mode are air conditioning
    units. All other climate entities are radiator valves. The central heating
    thermostat and any entity carrying the exclusion label are ignored. Moving
    a unit to another area, or labelling it, takes effect at the next update.


    External sensor offset. When a room has an external temperature sensor
    (either chosen explicitly in that room's section or auto-detected from the
    area):
    - Heating (radiator valves and AC in heat mode): if the external sensor is
      below the requested target and 0 < (unit_temp - external_temp) <= heat
      max offset, the unit setpoint is raised by that gap so it continues
      heating until the external sensor reaches the target. Gaps above the
      max offset or sensor readings outside 0–45 °C are ignored.
    - Cooling (AC in cool mode): if the external sensor is above the requested
      target and 0 < (external_temp - unit_temp) <= cool max offset, the unit
      setpoint is lowered by that gap so it continues cooling until the
      external sensor reaches the target. Gaps above the max offset or sensor
      readings outside 0–45 °C are ignored.
    To enable continuous 1-minute offset tracking without runaway, select the
    thermostat's "Room targets" text entity (created automatically once the
    firmware is flashed). You can leave it empty during initial setup.


    Request for T degrees from the thermostat.
    1. If "Raise the central heating target" is on, the central heating is on
       and T is above its target, the central target is raised to T, never
       above the maximum set here.
    2. Radiator valves that are not off are set to T (with heating offset),
       limited to the central heating target when that option is on.
    3. Air conditioning units in heat or cool mode are set to T (with heating
       or cooling offset), unless the policy says to leave them alone.
    4. If "Air conditioning assist" is on, T is above what the valves are
       allowed, and the room is colder than T by more than the gap, air
       conditioning units that are off are switched to heat at T. Nothing in
       this automation switches them off again.


    Weather. Outdoor conditions are pushed alongside the room list. Today's
    high, low and chance of rain come from weather.get_forecasts (daily). The
    optional outdoor temperature, humidity and feels-like sensors override the
    matching weather entity attributes when numeric.


    The automation uses esphome.thermostat_wt32s3_21s_set_rooms and
    esphome.thermostat_wt32s3_21s_set_weather, and listens for
    esphome.thermostat_room_set and esphome.thermostat_rooms_request. The
    ESPHome device must be allowed to perform Home Assistant actions.
  domain: automation
  input:
    room_1:
      name: Room 1
      collapsed: false
      input:
        room_1_area:
          name: Area
          description: Area for Room 1. Leave empty to skip.
          default: ""
          selector:
            area: {}
        room_1_icon:
          name: Icon
          default: ""
          selector:
            select:
              mode: dropdown
              options:
                - { label: "Initial letter (default)", value: "" }
                - { label: "Bed (Bedroom)", value: "bed" }
                - { label: "Sofa (Living room)", value: "sofa" }
                - { label: "Stove (Kitchen)", value: "stove" }
                - { label: "Desk (Study / Office)", value: "desk" }
                - { label: "Shower (Bathroom)", value: "shower" }
                - { label: "Table & chair (Dining)", value: "table_chair" }
                - { label: "Home (Hallway)", value: "home" }
                - { label: "Stairs (Landing)", value: "stairs" }
                - { label: "Washing machine (Utility)", value: "washing" }
                - { label: "Garage", value: "garage" }
                - { label: "Nursery", value: "baby" }
                - { label: "Radiator", value: "radiator" }
                - { label: "Thermometer", value: "thermometer" }
        room_1_temp_sensor:
          name: External temperature sensor
          description: Optional. Leave empty to use temperature sensors in the area automatically.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        room_1_heat_max_offset:
          name: Heating max offset
          description: Maximum gap (unit - external) allowed when boosting heating. 0 disables offset.
          default: 3.0
          selector:
            number:
              min: 0
              max: 10
              step: 0.5
              unit_of_measurement: "°C"
        room_1_cool_max_offset:
          name: Cooling max offset
          description: Maximum gap (external - unit) allowed when boosting cooling. 0 disables offset.
          default: 3.0
          selector:
            number:
              min: 0
              max: 10
              step: 0.5
              unit_of_measurement: "°C"

    room_2:
      name: Room 2
      collapsed: true
      input:
        room_2_area:

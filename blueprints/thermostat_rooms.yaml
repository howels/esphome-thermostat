                - { label: "Desk (Study / Office)", value: "desk" }
                - { label: "Shower (Bathroom)", value: "shower" }
                - { label: "Table & chair (Dining)", value: "table_chair" }
                - { label: "Home (Hallway)", value: "home" }
                - { label: "Stairs (Landing)", value: "stairs" }
                - { label: "Washing machine (Utility)", value: "washing" }
                - { label: "Garage", value: "garage" }
                - { label: "Nursery", value: "baby" }
                - { label: "Radiator", value: "radiator" }
                - { label: "Thermometer", value: "thermometer" }

# Example local device configuration for the WT32S3-21S rotary thermostat.
# Keep secrets, Wi-Fi credentials and the API encryption key in this file
# (or in secrets.yaml). Everything else lives in thermostat-wt32s3-21s-base.yaml.

substitutions:
  hostname: 'thermostat-wt32s3-21s'
  friendly_name: 'Thermostat'
  device_description: 'WT32S3-21S ZX2D10GE01R-V4848 rotary switch screen'
  climate_entity: climate.central_heating
  backlight_timeout_default: '60'
  backlight_fade: 5s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 1h
  ap:
    ssid: "Thermostat-Fallback"
    password: !secret thermostat_ap_password

api:
  encryption:
    key: !secret thermostat_api_key

ota:
  - platform: esphome

packages:
  thermostat: !include thermostat-wt32s3-21s-base.yaml

            y: 4
            width: 280
            height: 38
            text_font: roboto_lg
            text_align: CENTER
            long_mode: DOT
            text: " "
        - label:
            id: menu_extra_label
            align: CENTER
            y: 54
            width: 260
            height: 38
            text_font: roboto_lg
            text_align: CENTER
            text_color: graylight
            long_mode: DOT
            text: " "
        - button:
            id: menu_back_button
            state:
              disabled: true
            x: 0
            y: -196
            styles: style_menu_button
            widgets:
              - label:
                  styles: style_menu_button_label
                  text: "\U000F004D"
            on_focus:
              - lambda: 'id(menu_focus) = 0;'
              - script.execute: refresh_menu_centre
            on_long_press:
              - logger.log: "ui: long_press menu_back_button"
              - script.execute: goto_main_page
            on_short_click:
              - logger.log: "ui: short_click menu_back_button"
              - script.execute: goto_main_page
        - button:

globals:
  # Page shown or being shown: 1 main, 2 menu, 3 mode, 6 rooms, 7 room.
  - id: cur_page
    type: int
    initial_value: '1'
  # Page that currently accepts input. 0 while locked (transition, asleep, boot).
  - id: ui_page
    type: int
    initial_value: '0'
  - id: ui_ready
    type: bool
    initial_value: 'false'
  # True from the start of the idle fade-out until the backlight is fully off.
  - id: bl_fading
    type: bool
    initial_value: 'false'
  # True if the RGB ring was on when the idle timeout switched it off.
  - id: rgb_was_on
    type: bool
    initial_value: 'false'
  # True when the HVAC mode takes a target temperature (heat, cool, heat_cool, dry).
  - id: hvac_adjustable
    type: bool
    initial_value: 'false'
  # Target temperature set locally and not yet confirmed by HA.
  - id: set_temp_target
    type: float
    initial_value: '20.0'
  - id: set_temp_pending
    type: bool
    initial_value: 'false'
  # Menu ring focus: 0 Back, 1 Mode, 2..7 room 1..6.
  - id: menu_focus
    type: int
    initial_value: '0'
  # Rooms page focus: 0 = Back, 1..6 = room button.
  - id: rooms_focus
    type: int
    initial_value: '0'
  # Room shown on the room page (1..6).
  - id: sel_room
    type: int
    initial_value: '1'
  # Room target set locally and not yet confirmed by HA.
  - id: room_set_target
    type: float
    initial_value: '20.0'
  - id: room_set_pending
    type: bool
    initial_value: 'false'
  # Last valid target temperature drawn on screen (used when HA reports NaN).
  - id: shown_set_temp
    type: float
    initial_value: '20.0'

lvgl:
  encoders:
    - enter_button: push_button
      sensor: rotary
      long_press_time: 600ms
  bg_color: black
  scrollbar_mode: "OFF"
  default_font: roboto_reg
  text_color: white
  style_definitions:
    - id: style_menu_button
      align: CENTER
      bg_opa: TRANSP
      shadow_opa: TRANSP
      height: 50
      width: 50
      radius: 50%
    - id: style_menu_button_label
      align: CENTER
      y: 3
      text_font: roboto_med

  pages:
    ### GUI - THERMOSTAT
    - id: main_page
      widgets:
        - arc:
            id: arc_bg
            height: 468
            width: 468
            align: CENTER
            arc_color: graylight
            arc_opa: COVER
            arc_width: 2
            arc_rounded: false
        - arc:
            id: current_temp_arc
            adjustable: true
            state:
              disabled: true
            min_value: 120    # 12°C (* 10 because decimals not supported)
            max_value: 340    # 34°C
            height: 468
            width: 468
            align: CENTER
            arc_color: graylight
            arc_opa: COVER
            arc_width: 2
            arc_rounded: false
            indicator:
              arc_color: graylight
              arc_opa: COVER
              arc_width: 2
              arc_rounded: false
            knob:
              bg_color: white
            value: 230
        - meter:
            id: meter_ticks
            height: 480
            width: 480
            align: CENTER
            bg_opa: TRANSP
            border_width: 0
            scales:
              range_from: 120   # 12°C (* 10 because decimals not supported)
              range_to: 340     # 34°C
              ticks:
                count: 89
                length: 37
                width: 3
                color: graylight
              indicators:
                - line:
                    id: set_temp_needle
                    color: white
                    width: 8
                    length: -10
                    value: 230
                - arc:
                    id: diff_temp_arc
                    start_value: 120
                    end_value: 230
                    color: white
                    width: 2
        - obj:
            id: mode_bg
            height: 350
            width: 350
            radius: 175
            align: CENTER
            border_width: 0
            bg_color: black
        - roller:
            id: set_temp_roller
            state:
              disabled: true
            align: CENTER
            anim_duration: 500ms
            text_font: roboto_med
            text_opa: TRANSP
            bg_opa: TRANSP
            border_width: 0
            text_line_space: 30
            visible_row_count: 2
            selected:
              text_font: roboto_huge
              text_opa: COVER
              bg_opa: TRANSP
              border_width: 0
            options:
              - 16.0
              - 16.5
              - 17.0
              - 17.5
              - 18.0
              - 18.5
              - 19.0 
              - 19.5
              - 20.0
              - 20.5
              - 21.0
              - 21.5
              - 22.0
              - 22.5
              - 23.0
              - 23.5
              - 24.0
              - 24.5
              - 25.0
              - 25.5
              - 26.0
              - 26.5
              - 27.0
              - 27.5
              - 28.0
              - 28.5
              - 29.0
              - 29.5
              - 30.0
            selected_index: 14
        - label:
            id: celsius_label
            align: CENTER
            x: 100
            y: -43
            text: "°C"
        - label:
            id: mode_label
            align: CENTER
            y: -100
            text: "NESP"
        - label:
            id: weather_icon_label
            hidden: true
            align: CENTER
            y: -100
            text_font: roboto_huge
            text: " "
        - label:
            id: weather_temp_label
            hidden: true
            align: CENTER
            text_font: roboto_huge
            text: " "
        - label:
            id: weather_forecast_label
            hidden: true
            align: CENTER
            y: 70 
            text: " "
        - label:
            id: weather_feels_like_label
            hidden: true
            align: CENTER
            y: 130
            text: " "
        - label:
            id: current_temp_label
            align: CENTER
            y: 84
            text: " "
        - label:
            id: main_rooms_label
            align: CENTER
            y: 138
            width: 300
            text_align: CENTER
            text_color: graylight
            text_line_space: 4
            text: " "
        # Invisible full-screen button. It is the only enabled widget on the main
        # page, so it always holds encoder focus there. A click opens the menu.
        - button:
            id: main_click_button
            state:
              disabled: true
            x: 0
            y: 0
            width: 480
            height: 480
            align: CENTER
            radius: 0
            bg_opa: TRANSP
            border_width: 0
            shadow_opa: TRANSP
            outline_width: 0
            on_short_click:
              - logger.log: "ui: short_click main_click_button"
              - script.execute: goto_menu_page
            on_long_press:
              - logger.log: "ui: long_press main_click_button"
              - script.execute: goto_rooms_page

    ### GUI - MENU
    # Ring, clockwise from the top (45 deg steps): Back, Mode, then up to 6 rooms.
    # Explicit heights on the centred labels keep long_mode: DOT to one line so
    # lines never wrap into each other.
    - id: menu_page
      widgets:
        - label:
            id: menu_title_label
            align: CENTER
            y: -58
            width: 260
            height: 54
            text_font: roboto_med
            text_align: CENTER

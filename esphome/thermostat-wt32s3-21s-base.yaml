interval:
  # Drop the room list if HA has not sent one for rooms_max_age.
  - interval: 30s
    then:
      - lambda: |-
          if (thermostat_rooms.expire(millis(), ${rooms_max_age})) {
            id(rooms_summary).publish_state(thermostat_rooms.summary());
            id(controller_automation).publish_state("none");
            ESP_LOGW("rooms", "room list expired, no update from Home Assistant");
          }
      - script.execute: refresh_rooms_ui
      - lambda: |-
          if (thermostat_weather.expire(millis(), ${rooms_max_age}))
            ESP_LOGW("weather", "weather expired, no update from Home Assistant");
      - script.execute: refresh_weather_ui

script:
  - id: vibrate
    parameters:
      length_ms: int
    then:
      # XXX doesn't delay properly for short lengths (10-100ms)
      - switch.turn_on: vibration
      - delay: !lambda return length_ms;
      - switch.turn_off: vibration

  # --- UI input state machine ------------------------------------------------
  # Every interactive widget is disabled by default. LVGL sends no event to a
  # disabled widget, so a locked UI ignores presses and releases.
  #   ui_lock    disable all widgets; ui_page = 0
  #   ui_unlock  wait for the button to be released, then enable the widgets of
  #              cur_page and focus the safe one (ui_page = cur_page)
  # Widgets are never enabled while the button is down, so a press and its
  # release always reach the same widget.
  - id: ui_lock
    then:
      - lambda: 'id(ui_page) = 0;'
      - lvgl.widget.disable:
          - main_click_button
          - menu_back_button
          - menu_mode_button
          - menu_room_1_button
          - menu_room_2_button
          - menu_room_3_button
          - menu_room_4_button
          - menu_room_5_button
          - menu_room_6_button
          - mode_back_button
          - mode_off_button
          - mode_heat_button
          - mode_cool_button
          - mode_heat_cool_button
          - rooms_back_button
          - room_1_button
          - room_2_button
          - room_3_button
          - room_4_button
          - room_5_button
          - room_6_button
          - room_click_button
      - logger.log:
          format: "ui: locked (cur_page=%d)"
          args: [ 'id(cur_page)' ]

  - id: ui_unlock
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(ui_ready);'
          then:
            - wait_until:
                condition:
                  binary_sensor.is_off: push_button
                timeout: 2s
            - delay: 50ms
            - if:
                condition:
                  and:
                    - light.is_on: backlight
                    - not:
                        lvgl.is_paused:
                then:
                  - if:
                      condition:
                        lambda: 'return id(cur_page) == 1;'
                      then:
                        - lvgl.widget.enable: main_click_button
                        - lvgl.widget.focus: main_click_button
                  - if:
                      condition:
                        lambda: 'return id(cur_page) == 2;'
                      then:
                        - lvgl.widget.enable:
                            - menu_back_button
                            - menu_mode_button
                        - if:
                            condition:
                              lambda: 'return thermostat_rooms.count >= 1;'
                            then:
                              - lvgl.widget.enable: menu_room_1_button
                        - if:
                            condition:
                              lambda: 'return thermostat_rooms.count >= 2;'
                            then:
                              - lvgl.widget.enable: menu_room_2_button
                        - if:
                            condition:
                              lambda: 'return thermostat_rooms.count >= 3;'
                            then:
                              - lvgl.widget.enable: menu_room_3_button
                        - if:
                            condition:
                              lambda: 'return thermostat_rooms.count >= 4;'
                            then:
                              - lvgl.widget.enable: menu_room_4_button
                        - if:
                            condition:
                              lambda: 'return thermostat_rooms.count >= 5;'
                            then:
                              - lvgl.widget.enable: menu_room_5_button
                        - if:
                            condition:
                              lambda: 'return thermostat_rooms.count >= 6;'
                            then:
                              - lvgl.widget.enable: menu_room_6_button
                        # Back is the safe default: a second click leaves the menu.
                        - lvgl.widget.focus: menu_back_button
                  - if:
                      condition:
                        lambda: 'return id(cur_page) == 3;'
                      then:
                        - lvgl.widget.enable:
                            - mode_back_button
                            - mode_off_button
                            - mode_heat_button
                            - mode_cool_button
                            - mode_heat_cool_button
                        - lvgl.widget.focus: mode_back_button
                  - if:
                      condition:
                        lambda: 'return id(cur_page) == 6;'
                      then:
                        - lvgl.widget.enable: rooms_back_button
                        - if:
                            condition:
                              lambda: 'return thermostat_rooms.count >= 1;'
                            then:
                              - lvgl.widget.enable: room_1_button
                        - if:
                            condition:
                              lambda: 'return thermostat_rooms.count >= 2;'
                            then:
                              - lvgl.widget.enable: room_2_button
                        - if:
                            condition:
                              lambda: 'return thermostat_rooms.count >= 3;'
                            then:
                              - lvgl.widget.enable: room_3_button
                        - if:
                            condition:
                              lambda: 'return thermostat_rooms.count >= 4;'
                            then:
                              - lvgl.widget.enable: room_4_button
                        - if:
                            condition:
                              lambda: 'return thermostat_rooms.count >= 5;'
                            then:
                              - lvgl.widget.enable: room_5_button
                        - if:
                            condition:
                              lambda: 'return thermostat_rooms.count >= 6;'
                            then:
                              - lvgl.widget.enable: room_6_button
                        - lvgl.widget.focus: rooms_back_button
                  - if:
                      condition:
                        lambda: 'return id(cur_page) == 7;'
                      then:
                        - lvgl.widget.enable: room_click_button
                        - lvgl.widget.focus: room_click_button
                  - lambda: 'id(ui_page) = id(cur_page);'
                  - logger.log:
                      format: "ui: unlocked (ui_page=%d)"
                      args: [ 'id(ui_page)' ]

  # Called on every press and rotation. If the screen is off (or LVGL is paused
  # for antiburn) the input only wakes it; the UI stays locked until the button
  # is released.
  - id: ui_wake
    mode: restart
    then:
      - if:
          condition:
            or:
              - light.is_off: backlight
              - lvgl.is_paused:
              - lambda: 'return id(bl_fading);'
          then:
            - logger.log: "ui: input while asleep, waking (input consumed)"
            - script.execute: ui_lock
            - if:
                condition: lvgl.is_paused
                then:
                  - lvgl.resume:
                  - lvgl.widget.redraw:
            - light.turn_on: backlight
            - script.execute: ui_unlock
      # Every press and rotation restarts the idle timer, awake or not.
      - script.execute: backlight_idle

  # Fades the backlight and the RGB ring out after backlight_timeout seconds
  # without input. Restarts on every press, rotation, backlight-on event and
  # timeout change, which also cancels a fade in progress. Input during the fade
  # is treated as input while asleep (see ui_wake). A timeout of 0 disables it.
  - id: backlight_idle
    mode: restart
    then:
      - lambda: 'id(bl_fading) = false;'
      - if:
          # No light.is_on check: during the fade-in the current value can still
          # read as off. Turning off an already-off light does nothing.
          condition:
            lambda: 'return id(backlight_timeout).state > 0;'
          then:
            - delay: !lambda 'return (uint32_t) (id(backlight_timeout).state * 1000.0f);'
            - logger.log: "backlight: idle timeout, fading out"
            - lambda: |-
                id(bl_fading) = true;
                if (id(rgb_ring).remote_values.is_on()) id(rgb_was_on) = true;
            - light.turn_off:
                id: backlight
                transition_length: ${backlight_fade}
            - light.turn_off:
                id: rgb_ring
                transition_length: ${backlight_fade}
            - delay: ${backlight_fade}
            - lambda: 'id(bl_fading) = false;'

  # Navigate with a short animation. The UI is locked for the transition and
  # unlocked page_settle later, once the button is up.
  - id: goto_main_page
    mode: restart
    then:
      - lambda: 'id(cur_page) = 1;'
      - script.execute: ui_lock
      - lvgl.page.show:
          id: main_page
          animation: FADE_OUT
          time: ${page_anim}
      - delay: ${page_settle}
      - script.execute: ui_unlock
  - id: goto_menu_page
    mode: restart
    then:
      - lambda: 'id(cur_page) = 2;'
      - script.execute: ui_lock
      - lvgl.page.show:
          id: menu_page
          animation: FADE_IN
          time: ${page_anim}
      - delay: ${page_settle}
      - script.execute: ui_unlock
  - id: goto_mode_page
    mode: restart
    then:
      - lambda: 'id(cur_page) = 3;'
      - script.execute: ui_lock
      - lvgl.page.show:
          id: mode_page
          animation: FADE_IN
          time: ${page_anim}
      - delay: ${page_settle}
      - script.execute: ui_unlock
  - id: goto_rooms_page
    mode: restart
    then:
      - lambda: 'id(cur_page) = 6;'
      - script.execute: ui_lock
      - homeassistant.event:
          event: ${rooms_request_event}
      - script.execute: refresh_rooms_ui
      - lvgl.page.show:
          id: rooms_page
          animation: FADE_IN
          time: ${page_anim}
      - delay: ${page_settle}
      - script.execute: ui_unlock
  - id: goto_room_page
    mode: restart
    then:
      - lambda: 'id(cur_page) = 7;'
      - script.execute: ui_lock
      - script.execute: refresh_rooms_ui
      - lvgl.page.show:
          id: room_page
          animation: FADE_IN
          time: ${page_anim}
      - delay: ${page_settle}
      - script.execute: ui_unlock

  # --- rooms -------------------------------------------------------------------
  # thermostat_rooms (thermostat_rooms.h) holds the list from HA. Button
  # initials, the label beside the ring and the room page all redraw from it.
  # Buttons beyond the number of rooms draw nothing and stay disabled.
  - id: refresh_rooms_ui
    then:
      - lvgl.label.update:
          id: room_1_button_label
          text: !lambda 'return thermostat_rooms.button_label(0);'
      - lvgl.widget.update:
          id: room_1_button_label
          text_color: !lambda |-
            if (thermostat_rooms.count < 1) return lv_color_white();
            return lv_color_hex(ThermostatRooms::color_for(thermostat_rooms.room[0].action));
      - lvgl.label.update:
          id: menu_room_1_label
          text: !lambda 'return thermostat_rooms.button_label(0);'
      - lvgl.widget.update:
          id: menu_room_1_label
          text_color: !lambda |-
            if (thermostat_rooms.count < 1) return lv_color_white();
            return lv_color_hex(ThermostatRooms::color_for(thermostat_rooms.room[0].action));
      - lvgl.label.update:
          id: room_2_button_label
          text: !lambda 'return thermostat_rooms.button_label(1);'
      - lvgl.widget.update:
          id: room_2_button_label
          text_color: !lambda |-
            if (thermostat_rooms.count < 2) return lv_color_white();
            return lv_color_hex(ThermostatRooms::color_for(thermostat_rooms.room[1].action));
      - lvgl.label.update:
          id: menu_room_2_label
          text: !lambda 'return thermostat_rooms.button_label(1);'
      - lvgl.widget.update:
          id: menu_room_2_label
          text_color: !lambda |-
            if (thermostat_rooms.count < 2) return lv_color_white();
            return lv_color_hex(ThermostatRooms::color_for(thermostat_rooms.room[1].action));
      - lvgl.label.update:
          id: room_3_button_label
          text: !lambda 'return thermostat_rooms.button_label(2);'
      - lvgl.widget.update:
          id: room_3_button_label
          text_color: !lambda |-
            if (thermostat_rooms.count < 3) return lv_color_white();
            return lv_color_hex(ThermostatRooms::color_for(thermostat_rooms.room[2].action));
      - lvgl.label.update:
          id: menu_room_3_label
          text: !lambda 'return thermostat_rooms.button_label(2);'
      - lvgl.widget.update:
          id: menu_room_3_label
          text_color: !lambda |-
            if (thermostat_rooms.count < 3) return lv_color_white();
            return lv_color_hex(ThermostatRooms::color_for(thermostat_rooms.room[2].action));
      - lvgl.label.update:
          id: room_4_button_label
          text: !lambda 'return thermostat_rooms.button_label(3);'
      - lvgl.widget.update:
          id: room_4_button_label
          text_color: !lambda |-
            if (thermostat_rooms.count < 4) return lv_color_white();
            return lv_color_hex(ThermostatRooms::color_for(thermostat_rooms.room[3].action));
      - lvgl.label.update:
          id: menu_room_4_label
          text: !lambda 'return thermostat_rooms.button_label(3);'
      - lvgl.widget.update:
          id: menu_room_4_label
          text_color: !lambda |-
            if (thermostat_rooms.count < 4) return lv_color_white();
            return lv_color_hex(ThermostatRooms::color_for(thermostat_rooms.room[3].action));
      - lvgl.label.update:
          id: room_5_button_label
          text: !lambda 'return thermostat_rooms.button_label(4);'
      - lvgl.widget.update:
          id: room_5_button_label
          text_color: !lambda |-
            if (thermostat_rooms.count < 5) return lv_color_white();
            return lv_color_hex(ThermostatRooms::color_for(thermostat_rooms.room[4].action));
      - lvgl.label.update:
          id: menu_room_5_label
          text: !lambda 'return thermostat_rooms.button_label(4);'
      - lvgl.widget.update:
          id: menu_room_5_label
          text_color: !lambda |-
            if (thermostat_rooms.count < 5) return lv_color_white();
            return lv_color_hex(ThermostatRooms::color_for(thermostat_rooms.room[4].action));
      - lvgl.label.update:
          id: room_6_button_label
          text: !lambda 'return thermostat_rooms.button_label(5);'
      - lvgl.widget.update:
          id: room_6_button_label
          text_color: !lambda |-
            if (thermostat_rooms.count < 6) return lv_color_white();
            return lv_color_hex(ThermostatRooms::color_for(thermostat_rooms.room[5].action));
      - lvgl.label.update:
          id: menu_room_6_label
          text: !lambda 'return thermostat_rooms.button_label(5);'
      - lvgl.widget.update:
          id: menu_room_6_label
          text_color: !lambda |-
            if (thermostat_rooms.count < 6) return lv_color_white();
            return lv_color_hex(ThermostatRooms::color_for(thermostat_rooms.room[5].action));
      - lvgl.label.update:
          id: main_rooms_label
          text: !lambda 'return thermostat_rooms.main_summary();'
      - lvgl.label.update:
          id: rooms_title_label
          text: !lambda |-
            int f = id(rooms_focus);
            if (f == 0) return std::string("Rooms");
            if (f > thermostat_rooms.count) return std::string("");
            return thermostat_rooms.room[f - 1].name;
      - lvgl.label.update:
          id: rooms_sub_label
          text: !lambda |-
            static char buf[48];
            int f = id(rooms_focus);
            if (f == 0) {
              if (thermostat_rooms.count == 0) return std::string("No rooms yet");
              snprintf(buf, sizeof(buf), "%d room%s  %d heating", thermostat_rooms.count,
                       thermostat_rooms.count == 1 ? "" : "s", thermostat_rooms.heating());
              return std::string(buf);
            }
            if (f > thermostat_rooms.count) return std::string("");
            const ThermostatRoom &r = thermostat_rooms.room[f - 1];
            if (std::isnan(r.temp)) return std::string("Now --");
            snprintf(buf, sizeof(buf), "Now %.1f°", r.temp);
            return std::string(buf);
      - lvgl.label.update:
          id: rooms_detail_label
          text: !lambda |-
            int f = id(rooms_focus);
            if (f < 1 || f > thermostat_rooms.count) return std::string("");
            const ThermostatRoom &r = thermostat_rooms.room[f - 1];
            static char buf[32];
            const char *a = "Idle";
            if (r.action == "heating") a = "Heat";
            else if (r.action == "cooling") a = "Cool";
            else if (r.action == "off") a = "Off";
            if (std::isnan(r.target)) return std::string(a);
            snprintf(buf, sizeof(buf), "Set %.1f°  %s", r.target, a);
            return std::string(buf);
      - script.execute: refresh_menu_centre
      - script.execute: refresh_room_page

  - id: refresh_room_page
    then:
      - lvgl.label.update:
          id: room_name_label
          text: !lambda |-
            int s = id(sel_room);
            if (s < 1 || s > thermostat_rooms.count) return "";
            return thermostat_rooms.room[s - 1].name.c_str();
      - lvgl.label.update:
          id: room_temp_label
          text: !lambda |-
            static char buf[24];
            int s = id(sel_room);
            if (s < 1 || s > thermostat_rooms.count || std::isnan(thermostat_rooms.room[s - 1].temp)) return "Now --";
            snprintf(buf, sizeof(buf), "Now %.1f°C", thermostat_rooms.room[s - 1].temp);
            return buf;
      - lvgl.label.update:
          id: room_target_label
          text: !lambda |-
            static char buf[16];
            int s = id(sel_room);
            if (s < 1 || s > thermostat_rooms.count) return "--";
            float t = id(room_set_pending) ? id(room_set_target) : thermostat_rooms.room[s - 1].target;
            if (std::isnan(t)) return "--";
            snprintf(buf, sizeof(buf), "%.1f°C", t);
            return buf;
      - lvgl.label.update:
          id: room_action_label
          text: !lambda |-
            int s = id(sel_room);
            if (s < 1 || s > thermostat_rooms.count) return "";
            const std::string &a = thermostat_rooms.room[s - 1].action;
            if (a == "heating") return "Heating";
            if (a == "cooling") return "Cooling";
            if (a == "off") return "Off";
            if (a == "idle") return "Idle";
            return "";

  # Each detent changes a local target and redraws at once. One request goes to
  # HA after 700 ms of stillness. The HA script applies it to every unit in the
  # room and coordinates the central heating (see the script blueprint).
  - id: nudge_room_temp
    parameters:
      delta: float
    then:
      - lambda: |-
          int s = id(sel_room);
          if (s < 1 || s > thermostat_rooms.count) return;
          const ThermostatRoom &r = thermostat_rooms.room[s - 1];
          float base = id(room_set_pending) ? id(room_set_target) : r.target;
          if (std::isnan(base)) base = r.temp;
          if (std::isnan(base)) base = 20.0f;
          float t = base + delta;
          if (t < 16.0f) t = 16.0f;
          if (t > 30.0f) t = 30.0f;
          id(room_set_target) = t;
          id(room_set_pending) = true;
      - script.execute: refresh_room_page
      - script.execute: send_room_temp

  - id: send_room_temp
    mode: restart
    then:
      - delay: 700ms
      - if:
          condition:
            lambda: 'return id(sel_room) >= 1 && id(sel_room) <= thermostat_rooms.count;'
          then:
            - logger.log:
                format: "room_temp: %s sending %.1f"
                args: [ 'thermostat_rooms.room[id(sel_room) - 1].id.c_str()', 'id(room_set_target)' ]
            - homeassistant.event:
                event: ${room_set_event}
                data:
                  room: !lambda 'return thermostat_rooms.room[id(sel_room) - 1].id;'
                  temperature: !lambda 'return id(room_set_target);'
      # Keep the local value until HA sends the updated list (about 2 s), with a timeout.
      - delay: 6s
      - lambda: 'id(room_set_pending) = false;'
      - script.execute: refresh_room_page

  # --- target temperature ----------------------------------------------------
  # Each detent changes a local target and redraws at once. The value is sent
  # to HA once the dial has been still for 700 ms, so fast turns send one
  # request, not one per detent.
  - id: nudge_set_temp
    parameters:
      delta: float
    then:
      - lambda: |-
          float base = id(set_temp_pending) ? id(set_temp_target) : id(set_temperature).state;
          if (std::isnan(base)) base = id(shown_set_temp);
          float t = base + delta;
          if (t < 16.0f) t = 16.0f;    // roller range
          if (t > 30.0f) t = 30.0f;    // climate.central_heating max_temp
          id(set_temp_target) = t;
          id(set_temp_pending) = true;
      - script.execute: refresh_set_temp_ui
      - script.execute: send_set_temp

  - id: send_set_temp
    mode: restart
    then:
      - delay: 700ms
      - logger.log:
          format: "set_temp: sending %.1f"
          args: [ 'id(set_temp_target)' ]
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: ${climate_entity}
            temperature: !lambda 'return id(set_temp_target);'
      # Keep the local value until HA echoes it back, with a timeout.
      - delay: 3s
      - lambda: 'id(set_temp_pending) = false;'
      - script.execute: refresh_set_temp_ui

  - id: refresh_set_temp_ui
    then:
      - lambda: |-
          float t = id(set_temp_pending) ? id(set_temp_target) : id(set_temperature).state;
          if (!std::isnan(t)) id(shown_set_temp) = t;
      - lvgl.indicator.update:
          id: set_temp_needle
          value: !lambda 'return (int) lroundf(id(shown_set_temp) * 10);'
      - lvgl.indicator.update:
          id: diff_temp_arc
          start_value: !lambda |-
            float t = id(shown_set_temp);
            float c = id(current_temperature).state;
            if (std::isnan(c)) c = t;
            return (int) lroundf(std::min(t, c) * 10);
          end_value: !lambda |-
            float t = id(shown_set_temp);
            float c = id(current_temperature).state;
            if (std::isnan(c)) c = t;
            return (int) lroundf(std::max(t, c) * 10);
      - lvgl.roller.update:
          id: set_temp_roller
          selected_index: !lambda |-
            int i = (int) lroundf((id(shown_set_temp) - 16.0f) * 2.0f);
            if (i < 0) i = 0;
            if (i > 28) i = 28;
            return i;

  # Rotation while the heating is off switches it on. The 2 s delay stops one
  # turn sending a request per detent.
  - id: ui_heating_on
    then:
      - logger.log: "heating: turning on (rotation while off)"
      - homeassistant.action:
          action: climate.turn_on
          data:
            entity_id: ${climate_entity}
      - delay: 2s

  # hvac mode UI scripts
  # Clock, weather and the focused item.
  - id: update_menu_date_label
    then:
      - script.execute: refresh_menu_centre

  - id: refresh_menu_centre
    then:
      - lvgl.label.update:
          id: menu_title_label
          text: !lambda |-
            static char buf[16];
            int f = id(menu_focus);
            if (f == 0) {
              auto now = id(hass_time).now();
              static const char * const days[] = {"SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"};
              int d = now.day_of_week;
              if (d < 1 || d > 7) return std::string("--:--");
              snprintf(buf, sizeof(buf), "%s %02d:%02d", days[d - 1], now.hour, now.minute);
              return std::string(buf);
            }
            if (f == 1) return std::string("Mode");
            int i = f - 2;
            if (i < 0 || i >= thermostat_rooms.count) return std::string("");
            return thermostat_rooms.room[i].name;
      - lvgl.label.update:
          id: menu_detail_label
          text: !lambda |-
            static char buf[32];
            int f = id(menu_focus);
            auto mode_name = [](const std::string &m) -> std::string {
              if (m == "off") return "Off";
              if (m == "heat") return "Heat only";
              if (m == "cool") return "Cool only";
              if (m == "heat_cool") return "Heat or cool";
              return "";
            };
            if (f == 0) {
              if (thermostat_weather.valid) return thermostat_weather.outside_line();
              if (thermostat_rooms.count == 0) return std::string("No rooms yet");
              snprintf(buf, sizeof(buf), "%d rooms  %d heating", thermostat_rooms.count, thermostat_rooms.heating());
              return std::string(buf);
            }
            if (f == 1) return mode_name(id(hvac_mode).state);
            int i = f - 2;
            if (i < 0 || i >= thermostat_rooms.count || std::isnan(thermostat_rooms.room[i].temp)) return std::string("Now --");
            snprintf(buf, sizeof(buf), "Now %.1f°", thermostat_rooms.room[i].temp);
            return std::string(buf);
      - lvgl.label.update:
          id: menu_extra_label
          text: !lambda |-
            static char buf[32];
            int f = id(menu_focus);
            if (f == 0) return thermostat_weather.forecast_line();
            if (f == 1) return std::string("");
            int i = f - 2;
            if (i < 0 || i >= thermostat_rooms.count) return std::string("");
            const ThermostatRoom &r = thermostat_rooms.room[i];
            const char *act = "Idle";
            if (r.action == "heating") act = "Heat";
            else if (r.action == "cooling") act = "Cool";
            else if (r.action == "off") act = "Off";
            if (std::isnan(r.target)) return std::string(act);
            snprintf(buf, sizeof(buf), "Set %.1f°  %s", r.target, act);
            return std::string(buf);

  - id: set_mode_off
    then:
      - script.execute: hide_widgets
      - lvgl.label.update:
          id: mode_label
          text: "OFF"
      - lvgl.widget.update:
          id: mode_bg
          bg_color: mode_off
      - lvgl.label.update:
          id: menu_mode_button_label
          text: "\U000F0425"
          text_color: white
      - lvgl.widget.update:
          id: mode_off_button
          text_color: white
      - lvgl.widget.update:
          id: mode_heat_button
          text_color: graydark
      - lvgl.widget.update:
          id: mode_cool_button
          text_color: graydark
      - lvgl.widget.update:
          id: mode_heat_cool_button
          text_color: graydark
      - script.execute: refresh_menu_centre

  - id: set_mode_heat

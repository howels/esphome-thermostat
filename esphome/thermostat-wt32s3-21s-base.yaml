      - lvgl.label.update:
          id: mode_label
          text: "HEAT ONLY"
      - lvgl.widget.update:
          id: mode_bg
          bg_color: mode_heat
      - lvgl.label.update:
          id: menu_mode_button_label
          text: "\U000F0238"
          text_color: mode_heat
      - lvgl.widget.update:
          id: mode_off_button
          text_color: graydark
      - lvgl.widget.update:
          id: mode_heat_button
          text_color: mode_heat
      - lvgl.widget.update:
          id: mode_cool_button
          text_color: graydark
      - lvgl.widget.update:
          id: mode_heat_cool_button
          text_color: graydark
      - script.execute: refresh_menu_centre

  - id: set_mode_cool
    then:
      - script.execute: show_widgets
      - lvgl.label.update:
          id: mode_label
          text: "COOL ONLY"
      - lvgl.widget.update:
          id: mode_bg
          bg_color: mode_cool
      - lvgl.label.update:
          id: menu_mode_button_label
          text: "\U000F0717"
          text_color: mode_cool
      - lvgl.widget.update:
          id: mode_off_button
          text_color: graydark
      - lvgl.widget.update:
          id: mode_heat_button
          text_color: graydark
      - lvgl.widget.update:
          id: mode_cool_button
          text_color: mode_cool
      - lvgl.widget.update:
          id: mode_heat_cool_button
          text_color: graydark
      - script.execute: refresh_menu_centre

  - id: set_mode_heat_cool
    then:
      - script.execute: show_widgets
      - lvgl.label.update:
          id: mode_label
          text: "HEAT OR COOL"
      - lvgl.widget.update:
          id: mode_bg
          bg_color: mode_heat_cool
      - lvgl.label.update:
          id: menu_mode_button_label
          text: "\U000F1A79"
          text_color: mode_heat_cool
      - lvgl.widget.update:
          id: mode_off_button
          text_color: graydark
      - lvgl.widget.update:
          id: mode_heat_button
          text_color: graydark
      - lvgl.widget.update:
          id: mode_cool_button
          text_color: graydark
      - lvgl.widget.update:
          id: mode_heat_cool_button
          text_color: mode_heat_cool
      - script.execute: refresh_menu_centre

  # Outdoor weather from thermostat_weather (set_weather action). Redraws every
  # label that shows it. Also called when the data expires.
  - id: refresh_weather_ui
    then:
      - lvgl.label.update:
          id: weather_icon_label
          text: !lambda 'return std::string(thermostat_weather.icon());'
      - lvgl.label.update:
          id: weather_temp_label
          text: !lambda |-
            static std::string s;
            s = thermostat_weather.valid ? thermostat_weather.temp_text() : "";
            return s.c_str();
      - lvgl.label.update:
          id: weather_forecast_label
          text: !lambda |-
            static std::string s;
            s = thermostat_weather.forecast_line();
            return s.c_str();
      - lvgl.label.update:
          id: weather_feels_like_label
          text: !lambda |-
            static std::string s;
            s = thermostat_weather.detail_line();
            return s.c_str();
      - script.execute: refresh_menu_centre
      - lvgl.label.update:
          id: rooms_weather_label
          text: !lambda |-
            static std::string s;
            s = thermostat_weather.outside_line();
            return s.c_str();
      - lvgl.label.update:
          id: room_outside_label
          text: !lambda |-
            static std::string s;
            s = thermostat_weather.outside_line();
            return s.c_str();

  - id: show_widgets
    then:
      - lvgl.widget.show:
        - current_temp_arc
        - set_temp_roller
        - celsius_label
        - current_temp_label
        - main_rooms_label
        - meter_ticks
        - mode_label
      - lvgl.widget.hide:
        - weather_icon_label
        - weather_temp_label
        - weather_forecast_label
        - weather_feels_like_label
      - lvgl.indicator.update:
          id: set_temp_needle
          opa: COVER
      - lvgl.indicator.update:
          id: diff_temp_arc
          opa: COVER
  - id: hide_widgets
    then:
      - lvgl.widget.hide:
        - current_temp_arc
        - set_temp_roller
        - celsius_label
        - current_temp_label
        - main_rooms_label
        - meter_ticks
        - mode_label
      - lvgl.widget.show:
        - weather_icon_label
        - weather_temp_label
        - weather_forecast_label
        - weather_feels_like_label
      - lvgl.indicator.update:
          id: set_temp_needle
          opa: TRANSP
      - lvgl.indicator.update:
          id: diff_temp_arc
          opa: TRANSP

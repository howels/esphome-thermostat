substitutions:
  device_description: 'WT32S3-21S ZX2D10GE01R-V4848 rotary switch screen'
  climate_entity: climate.central_heating
  rooms_request_event: esphome.thermostat_rooms_request
  room_set_event: esphome.thermostat_room_set
  rooms_max_age: '180000'
  page_anim: 200ms
  page_settle: 260ms
  backlight_timeout_default: '60'
  backlight_fade: 5s

# Logger must be at least debug (default)
# disable UART logging
logger:
  level: DEBUG
  baud_rate: 0

preferences:
  flash_write_interval: 30min

# Enable Home Assistant API
api:
  reboot_timeout: 1h
  # HA calls esphome.thermostat_wt32s3_21s_set_rooms with the room list.
  actions:
    - action: set_rooms
      variables:
        data: string
      then:
        - lambda: |-
            thermostat_rooms.parse(data, millis());
            if (id(sel_room) < 1 || id(sel_room) > thermostat_rooms.count) id(sel_room) = 1;
            // Drop the optimistic target once HA reports the value we sent.
            if (id(room_set_pending) && id(sel_room) <= thermostat_rooms.count) {
              float t = thermostat_rooms.room[id(sel_room) - 1].target;
              if (!std::isnan(t) && fabsf(t - id(room_set_target)) < 0.01f) id(room_set_pending) = false;
            }
            id(rooms_summary).publish_state(thermostat_rooms.summary());
        - logger.log:
            format: "rooms: %s"
            args: [ 'thermostat_rooms.summary().c_str()' ]
        - script.execute: refresh_rooms_ui
    # HA calls esphome.thermostat_wt32s3_21s_set_weather with the outdoor conditions.
    - action: set_weather
      variables:
        data: string
      then:
        - lambda: 'thermostat_weather.parse(data, millis());'
        - logger.log:
            format: "weather: %s %s %s"
            args: [ 'thermostat_weather.condition.c_str()', 'thermostat_weather.temp_text().c_str()', 'thermostat_weather.forecast_line().c_str()' ]
        - script.execute: refresh_weather_ui
    # HA calls esphome.thermostat_wt32s3_21s_set_controller with the automation name/entity_id.
    - action: set_controller
      variables:
        name: string
      then:
        - lambda: 'id(controller_automation).publish_state(name.empty() ? std::string("none") : std::string(name));'
        - logger.log:
            format: "controller: %s"
            args: [ 'name.c_str()' ]
  # Ask HA for the room list as soon as it can answer.
  on_client_connected:
    - homeassistant.event:
        event: ${rooms_request_event}

captive_portal:

# Enable web server API
web_server:
  port: 80

esphome:
  name: ${hostname}
  name_add_mac_suffix: False
  friendly_name: ${friendly_name}
  comment: ${device_description}
  includes:
    - thermostat_rooms.h
    - thermostat_weather.h
  on_boot:
    - light.turn_on:
        id: backlight
        brightness: 0.7
    # LVGL and the first page are up after a short delay; only then accept input.
    - delay: 3s
    - lambda: 'id(ui_ready) = true;'
    - logger.log: "ui: ready"
    - script.execute: ui_unlock
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    #version: 5.3.5
    #platform_version: 6.8.1
    #platform_version: https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
    #platform_version: 54.03.21-2
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
psram:
  mode: octal
  speed: 80MHz

debug:
  update_interval: 60s

#<<: !include _common.yaml

output:
  ### DISPLAY BACKLIGHT
  - platform: ledc
    id: display_led
    pin: 38
    zero_means_zero: true

light:
  - platform: monochromatic
    id: backlight
    output: display_led
    name: Backlight
    icon: mdi:brightness-percent
    default_transition_length: 500ms
    restore_mode: ALWAYS_ON
    # Input is only accepted while the backlight is on. A press or rotation that
    # wakes the screen is consumed by ui_wake and never reaches a widget.
    on_turn_on:
      - logger.log: "backlight: on"
      - script.execute: ui_unlock
      - script.execute: backlight_idle
      # Bring the RGB ring back if the idle timeout switched it off.
      - if:
          condition:
            lambda: 'return id(rgb_was_on);'
          then:
            - lambda: 'id(rgb_was_on) = false;'
            - light.turn_on: rgb_ring
    on_turn_off:
      - logger.log: "backlight: off"
      - script.execute: ui_lock

  ### RGB RING LIGHT
  - platform: esp32_rmt_led_strip
    name: RGB LED
    id: rgb_ring
    pin: 4
    num_leds: 13
    #rmt_channel: 0
    channel_colors: GRB
    chipset: WS2812

switch:
  ### VIBRATION MOTOR
  - platform: gpio
    id: vibration
    name: Vibration Motor
    icon: mdi:vibrate
    internal: true
    pin: 7

  ### DISPLAY ANTI BURN-IN
  - platform: template
    name: Antiburn
    id: switch_antiburn
    icon: mdi:television-shimmer
    optimistic: true
    internal: true
    turn_on_action:
      - logger.log: "Starting Antiburn"
      - light.turn_off: backlight
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - delay: 1s
      - lvgl.pause:
          show_snow: true
    turn_off_action:
      - logger.log: "Stopping Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - delay: 1s
            - lvgl.pause:
      - light.turn_on: backlight

number:
  ### BACKLIGHT TIMEOUT
  # Seconds of no press or rotation before the backlight turns off. 0 disables
  # the timeout. The value survives reboots and is set from the device page in HA.
  - platform: template
    name: Backlight timeout
    id: backlight_timeout
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: s
    mode: box
    min_value: 0
    max_value: 3600
    step: 5
    initial_value: ${backlight_timeout_default}
    restore_value: true
    optimistic: true
    on_value:
      - logger.log:
          format: "backlight: timeout set to %.0f s"
          args: [ 'x' ]
      - script.execute: backlight_idle

text:
  ### ROOM TARGETS STORE
  # Used by the HA blueprint to remember requested room targets across runs so
  # continuous external-sensor offset tracking has no runaway.
  - platform: template
    name: Room targets
    id: room_targets_store
    icon: mdi:thermometer-lines
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true

time:
  - platform: homeassistant
    id: hass_time
    on_time:
      - seconds: 0
        then:
          - script.execute: update_menu_date_label
      - hours: 2,3,4,5
        minutes: 5
        seconds: 0
        then:
          - switch.turn_on: switch_antiburn
      - hours: 2,3,4,5
        minutes: 35
        seconds: 0
        then:
          - switch.turn_off: switch_antiburn

binary_sensor:
  ### CENTRE PUSH BUTTON
  # LVGL reads this sensor as the encoder ENTER key. All UI actions come from
  # LVGL widget events (on_short_click / on_long_press). The automations below
  # only log and wake the screen.
  - platform: gpio
    name: Button
    id: push_button
    icon: mdi:circle-outline
    internal: true
    pin:
      number: 3
      mode: INPUT
      inverted: true
      ignore_strapping_warning: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - logger.log:
          format: "button: press (page=%d ui_page=%d)"
          args: [ 'id(cur_page)', 'id(ui_page)' ]
      - script.execute: ui_wake
    on_release:
      - logger.log: "button: release"

  - platform: status
    name: Status

button:
- platform: restart
  name: Restart
  disabled_by_default: True

sensor:
  - platform: uptime
    name: Uptime
    disabled_by_default: True

  ### ROTARY ENCODER
  - platform: rotary_encoder
    name: Rotary Encoder
    id: rotary
    icon: mdi:cached
    internal: true
    pin_a:
      number: 6
      inverted: true
      mode: INPUT
    pin_b:
      number: 5
      inverted: true
      mode: INPUT
    on_value:
      # Wake first: a rotation that wakes the screen only wakes it.
      - script.execute: ui_wake
      - if:
          condition:
            lambda: 'return id(ui_page) == 1 && id(hvac_mode).state == "off";'
          then:
            - script.execute: ui_heating_on
    on_clockwise:
      - if:
          condition:
            and:
              - light.is_on: backlight
              - lambda: 'return id(ui_page) == 1 && id(hvac_adjustable);'
          then:
            - script.execute:
                id: nudge_set_temp
                delta: 0.5
      - if:
          condition:
            and:
              - light.is_on: backlight
              - lambda: 'return id(ui_page) == 7;'
          then:
            - script.execute:
                id: nudge_room_temp
                delta: 0.5
    on_anticlockwise:
      - if:
          condition:
            and:
              - light.is_on: backlight
              - lambda: 'return id(ui_page) == 1 && id(hvac_adjustable);'
          then:
            - script.execute:
                id: nudge_set_temp
                delta: -0.5
      - if:
          condition:
            and:
              - light.is_on: backlight
              - lambda: 'return id(ui_page) == 7;'
          then:
            - script.execute:
                id: nudge_room_temp
                delta: -0.5

  ### HASS - HVAC SET TEMP
  - platform: homeassistant
    entity_id: ${climate_entity}
    id: set_temperature
    attribute: temperature
    internal: true
    on_value:
      # Drop the optimistic value once HA reports the value we sent.
      - lambda: |-
          if (id(set_temp_pending) && !std::isnan(x) && fabsf(x - id(set_temp_target)) < 0.01f) {
            id(set_temp_pending) = false;
          }
      - script.execute: refresh_set_temp_ui

  ### HASS - HVAC CURRENT TEMP
  - platform: homeassistant
    entity_id: ${climate_entity}
    id: current_temperature
    attribute: current_temperature
    internal: true
    on_value:
      - lvgl.arc.update:
          id: current_temp_arc
          value: !lambda 'return std::isnan(x) ? 120 : (int) lroundf(x * 10);'
      - script.execute: refresh_set_temp_ui
      - lvgl.label.update:
          id: current_temp_label
          text:
            format: "%.1f°C"
            args: [ 'round(x * 10) / 10' ]

  ### HASS - HVAC CURRENT HUMIDITY
  - platform: homeassistant
    entity_id: ${climate_entity}
    id: current_humidity
    attribute: current_humidity
    internal: true

text_sensor:
  ### HASS - HVAC MODE
  - platform: homeassistant
    entity_id: ${climate_entity}
    id: hvac_mode
    internal: true
    on_value:
      - lambda: |-
          id(hvac_adjustable) = (x == "heat" || x == "cool" || x == "heat_cool" || x == "dry");
      - logger.log:
          format: "hvac_mode: %s"
          args: [ 'x.c_str()' ]
      - lambda: |-
          if (x.compare("off") == 0) {
            id(set_mode_off).execute();
          } else if (x.compare("heat") == 0) {
            id(set_mode_heat).execute();
          } else if (x.compare("cool") == 0) {
            id(set_mode_cool).execute();
          } else if (x.compare("heat_cool") == 0) {
            id(set_mode_heat_cool).execute();
          }

  ### ROOMS (pushed by HA, see api: actions)
  # Rooms the firmware currently holds. Shown on the device page.
  - platform: template
    name: Rooms
    id: rooms_summary
    icon: mdi:home-thermometer
    entity_category: diagnostic

  - platform: template
    name: Controller automation
    id: controller_automation
    icon: mdi:robot-outline
    entity_category: diagnostic

  - platform: debug
    reset_reason:
      name: Reset Reason
      disabled_by_default: True

spi:
  ### DISPLAY
  clk_pin:
    number: 47
    allow_other_uses: true
  mosi_pin:
    number: 41
    allow_other_uses: true
display:
  - platform: st7701s
    id: screen
    spi_mode: MODE0
    data_rate: 10MHz
    color_order: RGB
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      width: 480
      height: 480
    cs_pin: 21
    de_pin: 39
    vsync_pin: 48
    hsync_pin: 40
    pclk_pin:
      number: 45
      ignore_strapping_warning: true
    pclk_frequency: 15MHz
    pclk_inverted: false
    hsync_pulse_width: 10
    hsync_back_porch:  10
    hsync_front_porch: 10
    vsync_pulse_width:  2
    vsync_back_porch:  12
    vsync_front_porch: 14
    data_pins:
      blue:
        - number: 47                # LCD_D0  = b0
          allow_other_uses: true
        - number: 41                # LCD_D1  = b1
          allow_other_uses: true
        - 0                         # LCD_D2  = b2
        - 42                        # LCD_D3  = b3
        - 14                        # LCD_D4  = b4
      green:
        - 8                         # LCD_D5  = g0
        - 13                        # LCD_D6  = g1
        - 18                        # LCD_D7  = g2
        - 12                        # LCD_D8  = g3
        - 11                        # LCD_D9  = g4
        - 17                        # LCD_D10 = g5
      red:
        - 10                        # LCD_D11 = r0
        - 16                        # LCD_D12 = r1
        - 9                         # LCD_D13 = r2
        - 15                        # LCD_D14 = r3
        - 46                        # LCD_D15 = r4
    init_sequence:
      # Reference: wireless-tag sample code: 
      # https://github.com/wireless-tag-com/ZX2D10GE01R-V4848/blob/master/main/screen.c
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]    # CMD2_BKSEL (command bank select BK3, BK func enabled)
      - [0xEF, 0x08]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]    # CMD2_BKSEL (command bank select BK0, BK func disabled)
      - [0xC0, 0x3B, 0x00]                      # Scan line
      - [0xC1, 0x0B, 0x02]                      # VBP
      - [0xC2, 0x07, 0x02]
      - [0xCC, 0x10]
      - [0xCD, 0x08]                            # RGB format | ?565??? 666??
      - [0xB0, 0x00, 0x11, 0x16, 0x0e, 0x11, 0x06, 0x05, 0x09, 0x08, 0x21, 0x06, 0x13, 0x10, 0x29, 0x31, 0x18]   # IPS | 255 | 251 | 247 down | 239 | 231 | 203 | 175 | 147 | 108 | 80 | 52 | 24 | 16 | 8 down | 4 | 0
      - [0xB1, 0x00, 0x11, 0x16, 0x0e, 0x11, 0x07, 0x05, 0x09, 0x09, 0x21, 0x05, 0x13, 0x11, 0x2a, 0x31, 0x18]   # IPS | 255 | 251 | 247 down | 239 | 231 | 203 | 175 | 147 | 108 | 80 | 52 | 24 | 16 | 8 down | 4 | 0
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]
      - [0xB0, 0x6d]                            # VOP  3.5375+ *x 0.0125 | 5D
      - [0xB1, 0x37]                            # VCOM amplitude setting
      - [0xB2, 0x81]                            # VGH Voltage setting | 12V
      - [0xB3, 0x80]
      - [0xB5, 0x43]                            # VGL Voltage setting | -8.3V
      - [0xB7, 0x85]
      - [0xB8, 0x20]
      - [0xC1, 0x78]
      - [0xC2, 0x78]
      - [0xD0, 0x88]
      - [0xE0, 0x00, 0x00, 0x02]
      - [0xE1, 0x03, 0xA0, 0x00, 0x00, 0x04, 0xA0, 0x00, 0x00, 0x00, 0x20, 0x20]
      - [0xE2, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE3, 0x00, 0x00, 0x11, 0x00]
      - [0xE4, 0x22, 0x00]
      - [0xE5, 0x05, 0xEC, 0xA0, 0xA0, 0x07, 0xEE, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE6, 0x00, 0x00, 0x11, 0x00]
      - [0xE7, 0x22, 0x00]
      - [0xE8, 0x06, 0xED, 0xA0, 0xA0, 0x08, 0xEF, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xEB, 0x00, 0x00, 0x40, 0x40, 0x00, 0x00, 0x00]
      - [0xED, 0xFF, 0xFF, 0xFF, 0xBA, 0x0A, 0xBF, 0x45, 0xFF, 0xFF, 0x54, 0xFB, 0xA0, 0xAB, 0xFF, 0xFF, 0xFF]
      - [0xEF, 0x10, 0x0D, 0x04, 0x08, 0x3F, 0x1F]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]    # CMD2_BKSEL (command bank select BK3, BK func enabled)
      - [0xEF, 0x08]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]    # CMD2_BKSEL (command bank select BK0, BK func disabled)
      - [0x36, 0x00]                            # MADCTL_CMD (already in esphome ST7701S::write_init_sequence_)
      - [0x3A, 0x66]                            # COLMOD 55/50=16bit(RGB565); 66=18bit(RGB666); 77?????3AH?=24bit(RGB888)
      # - [0x11]                                  # SLEEP_OUT (already in esphome)
      # - delay 120ms
      # - [0x29]                                  # DISPLAY_ON (already in esphome)
      # - delay 20ms
      #

